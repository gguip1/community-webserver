name: Host production deploy

on:
  workflow_dispatch:
    inputs:
      fe_image_tag:
        description: Approved immutable frontend GHCR image tag
        required: true
        type: string
      be_image_tag:
        description: Approved immutable backend GHCR image tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wepick-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved images to production host
    runs-on: [self-hosted, linux, wepick-prod]
    # Do not permit a workflow dispatched from an unprotected branch to reach production.
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GHCR
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          test -n "$GHCR_PULL_TOKEN"
          printf %s "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare ephemeral deployment environment
        id: env
        run: |
          test -r /etc/wepick/prod.env
          DEPLOY_ENV=$(mktemp)
          cp /etc/wepick/prod.env "$DEPLOY_ENV"
          chmod 600 "$DEPLOY_ENV"
          printf "FE_IMAGE_TAG=%s\n" "${{ inputs.fe_image_tag }}" >> "$DEPLOY_ENV"
          printf "BE_IMAGE_TAG=%s\n" "${{ inputs.be_image_tag }}" >> "$DEPLOY_ENV"
          echo "path=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"

      - name: Deploy and verify
        run: ./scripts/deploy-host.sh "${{ steps.env.outputs.path }}"

      - name: Remove ephemeral deployment environment
        if: always()
        run: rm -f "${{ steps.env.outputs.path }}"
